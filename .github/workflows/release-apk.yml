name: release-apk

on:
  push:
    branches: [main, Main]
    paths:
      - app/build.gradle.kts
      - .github/workflows/release-apk.yml
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android-build
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/Main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Restore keystore
        env:
          CURSOR_ANDROID_KEYSTORE_BASE64: ${{ secrets.CURSOR_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CURSOR_ANDROID_KEYSTORE_BASE64" ]; then
            echo "No signing keystore configured"
            exit 0
          fi
          mkdir -p app/signing
          printf '%s' "$CURSOR_ANDROID_KEYSTORE_BASE64" | base64 -d > app/signing/stable.p12
      - run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          ./gradlew --no-daemon :app:assembleRelease
        env:
          CURSOR_ANDROID_STORE_PASSWORD: ${{ secrets.CURSOR_ANDROID_STORE_PASSWORD }}
          CURSOR_ANDROID_KEY_PASSWORD: ${{ secrets.CURSOR_ANDROID_KEY_PASSWORD }}
          CURSOR_ANDROID_KEY_ALIAS: ${{ secrets.CURSOR_ANDROID_KEY_ALIAS }}
      - id: ver
        run: |
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
      - name: Wait for Security and CodeQL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          deadline=$((SECONDS + 2400))
          while true; do
            runs="$(gh run list --commit "$sha" --limit 30 --json name,status,conclusion)"
            echo "$runs"
            failed="$(printf '%s' "$runs" | jq -r '.[] | select(.name == "Security" or .name == "CodeQL") | select(.status == "completed") | select(.conclusion != "success" and .conclusion != "skipped") | .name' | sort -u | tr '\n' ' ')"
            if [ -n "${failed// }" ]; then
              echo "required checks failed: $failed"
              exit 1
            fi
            security="$(printf '%s' "$runs" | jq -r '[.[] | select(.name == "Security")] | first | if . == null then "missing" else .status + "/" + (.conclusion // "") end')"
            codeql="$(printf '%s' "$runs" | jq -r '[.[] | select(.name == "CodeQL")] | first | if . == null then "missing" else .status + "/" + (.conclusion // "") end')"
            echo "Security=$security CodeQL=$codeql"
            if [ "$security" = "completed/success" ] && [ "$codeql" = "completed/success" ]; then
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "timed out waiting for Security and CodeQL"
              exit 1
            fi
            sleep 20
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          title="${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})"
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          elif git ls-remote --exit-code origin "refs/tags/$tag"; then
            gh release create "$tag" "$apk" --title "$title" --verify-tag --latest
          else
            gh release create "$tag" "$apk" --title "$title" --latest --target "$GITHUB_SHA"
          fi
