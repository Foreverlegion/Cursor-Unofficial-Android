name: release-apk

on:
  push:
    branches: [main, Main]
    paths:
      - app/build.gradle.kts
      - .github/workflows/release-apk.yml
      - RELEASE_NOTES.md
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android-build
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/Main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Restore keystore
        env:
          CURSOR_ANDROID_KEYSTORE_BASE64: ${{ secrets.CURSOR_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CURSOR_ANDROID_KEYSTORE_BASE64" ]; then
            echo "No signing keystore configured"
            exit 0
          fi
          mkdir -p app/signing
          printf '%s' "$CURSOR_ANDROID_KEYSTORE_BASE64" | base64 -d > app/signing/stable.p12
      - id: built
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
          if [ ! -f app/signing/stable.p12 ]; then
            echo "Release keystore missing"
            exit 1
          fi
          name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          file="cursor-android-${name}.aab"
          cp app/build/outputs/bundle/release/app-release.aab "$file"
          echo "aab=$file" >> "$GITHUB_OUTPUT"
        env:
          CURSOR_ANDROID_STORE_PASSWORD: ${{ secrets.CURSOR_ANDROID_STORE_PASSWORD }}
          CURSOR_ANDROID_KEY_PASSWORD: ${{ secrets.CURSOR_ANDROID_KEY_PASSWORD }}
          CURSOR_ANDROID_KEY_ALIAS: ${{ secrets.CURSOR_ANDROID_KEY_ALIAS }}
          # Fine-grained PAT: this repo Issues read/write, plus Account Gists read/write.
          CURSOR_ANDROID_ISSUES_TOKEN: ${{ secrets.CURSOR_ANDROID_ISSUES_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.built.outputs.aab }}
          path: ${{ steps.built.outputs.aab }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cursor-android-bundle
          path: ${{ steps.built.outputs.aab }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cursor-android-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
