name: Security

on:
  push:
    branches: [main, Main]
  pull_request:
    branches: [main, Main]
  schedule:
    - cron: "12 8 * * 1"
  workflow_dispatch:

jobs:
  lint:
    name: Android lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android-build
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/Main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          if ! ./gradlew --no-daemon :app:lintRelease; then
            echo "--- lint report ---"
            find app/build -name 'lint-results-release.txt' -print -exec cat {} \;
            exit 1
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2.2.3
        with:
          scan-args: |-
            --format=sarif
            --output=osv.sarif
            .
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        if: hashFiles('osv.sarif') != ''
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  filesystem:
    name: Filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy
